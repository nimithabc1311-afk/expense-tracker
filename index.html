<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header>
      <h1>💰 Expense Tracker</h1>
      <p class="subtitle">Track where your money goes</p>
    </header>

    <!-- SUMMARY CARDS -->
    <section class="summary">
      <div class="card income-card">
        <span class="card-label">Total Income</span>
        <span class="card-amount" id="total-income">₹0</span>
      </div>
      <div class="card expense-card">
        <span class="card-label">Total Expenses</span>
        <span class="card-amount" id="total-expense">₹0</span>
      </div>
      <div class="card balance-card">
        <span class="card-label">Balance</span>
        <span class="card-amount" id="balance">₹0</span>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <div class="main">

      <!-- ADD TRANSACTION FORM -->
      <div class="form-box">
        <h2>Add Transaction</h2>

        <label>Description</label>
        <input type="text" id="desc" placeholder="e.g. Lunch, Salary..." />

        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 500" />

        <label>Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label>Category</label>
        <select id="category">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Bills">💡 Bills</option>
          <option value="Health">🏥 Health</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Salary">💼 Salary</option>
          <option value="Other">📦 Other</option>
        </select>

        <label>Date</label>
        <input type="date" id="date" />

        <button onclick="addTransaction()">+ Add Transaction</button>
      </div>

      <!-- CHART -->
      <div class="chart-box">
        <h2>Spending by Category</h2>
        <canvas id="expenseChart"></canvas>
        <p id="no-data-msg" style="text-align:center; color:#aaa; margin-top:20px;">No expense data yet</p>
      </div>

    </div>

    <!-- TRANSACTION LIST -->
    <div class="list-box">
      <div class="list-header">
        <h2>Transactions</h2>
        <button class="clear-btn" onclick="clearAll()">🗑 Clear All</button>
      </div>
      <ul id="transaction-list">
        <li class="empty-msg">No transactions yet. Add one above!</li>
      </ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
